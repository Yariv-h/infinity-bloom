name: Deploy Infinity Bloom bundle
on:
  workflow_dispatch:
    inputs:
      bundle_url:
        description: Bundle ZIP URL
        required: true
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download bundle
        env:
          BUNDLE_URL: ${{ inputs.bundle_url }}
        run: |
          curl --fail --location --retry 3 "$BUNDLE_URL" -o /tmp/bundle.zip
          unzip -q /tmp/bundle.zip -d /tmp/bundle
      - name: Deploy public build
        run: |
          cp /tmp/bundle/*/deploy/v16/index.html v16/index.html
          git config user.name Yariv-h
          git config user.email 3518124+Yariv-h@users.noreply.github.com
          git add v16/index.html
          git diff --cached --quiet || git commit -m "v16: melody story sound reactivity"
          git push
      - name: Deploy readable source
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          git clone "https://x-access-token:${PAT}@github.com/Yariv-h/Infinity-bloom-src.git" /tmp/src
          mkdir -p /tmp/src/v16 && cp /tmp/bundle/*/readable/v16/index.html /tmp/src/v16/index.html
          cd /tmp/src
          git config user.name Yariv-h
          git config user.email 3518124+Yariv-h@users.noreply.github.com
          git add v16/index.html
          git diff --cached --quiet || git commit -m "v16: melody story sound reactivity"
          git push
